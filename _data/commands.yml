#
# The commands the site shows, as the Renux console shows them.

build:
  - git clone --depth 1 https://github.com/renuxproject/renux.git
  - cd renux
  - zig build

verify:
  - sha256sum -c SHA256
  - unxz renux-nightly-amd64-*-installer.iso.xz
  - unxz renux-nightly-amd64-*-memstick.img.xz

verify_release:
  - sha256sum -c SHA256
  - unxz renux-0.1.2-amd64-installer.iso.xz
  - unxz renux-0.1.2-amd64-memstick.img.xz

write_memstick:
  - sudo dd if=renux-0.1.2-amd64-memstick.img of=/dev/da0 bs=1m conv=fsync
  - sudo gpart recover da0
