{%- assign t = site.data.i18n[page.lang] -%}
{%- assign links = site.data.links %}
<html lang="{{ page.lang }}">
<head>
{% include head.html %}
</head>
<body class="is-{{ page.ref | default: 'page' }}">
<a class="skip" href="#main">{{ t.skip }}</a>
<div class="dawn{% unless page.ref == 'home' %} dawn-short{% endunless %}">
<span class="sun" aria-hidden="true"></span>
{% include header.html %}
{% include hero.html %}
</div>

<main id="main" tabindex="-1">
{{ content }}
</main>

{% include ground.html %}
</body>
</html>
